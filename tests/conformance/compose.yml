# The OpenID Foundation conformance suite (https://gitlab.com/openid/conformance-suite), prebuilt
# images pinned by digest (release 5.3.4), for tests/conformance/run_suite.sh. Its own nginx
# certificate has no subjectAltName, which the wallet rightly refuses, so a test one is mounted.
services:
  mongodb:
    image: mongo:6.0.13
  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx@sha256:8d5bcd5ad6a1a939af9d1ff61006d6097c2ebfc718b0e602e63588cc7fe4a2bb
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ${SUITE_CERTS}/tls.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro
      - ${SUITE_CERTS}/tls.key:/etc/ssl/private/nginx-selfsigned.key:ro
    networks:
      default:
        aliases:
          # the suite's own requests to its public name reach nginx
          - localhost.emobix.co.uk
    depends_on:
      - server
  server:
    image: registry.gitlab.com/openid/conformance-suite@sha256:17b3019e7fcacdc0f764f1272b50730222cce9e68ac3ab73ea6fb626e46f0b45
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      # dev: no login, the API answers anyone (it only listens on 127.0.0.1)
      SPRING_PROFILES_ACTIVE: dev
      # placeholders: the server does not start without them, and dev never uses them
      OIDC_GOOGLE_CLIENTID: google-client
      OIDC_GOOGLE_SECRET: google-secret
      OIDC_GITLAB_CLIENTID: gitlab-client
      OIDC_GITLAB_SECRET: gitlab-secret
    depends_on:
      - mongodb
