# APT repository on GitHub Pages with the .deb of a release, so installed .deb packages get it
# with the system updates (packaging/build_apt_repo.sh). Runs when a release becomes the latest
# one (a tested pre-release marked as a release); Actions -> APT repository -> Run workflow redoes
# it for the latest release.
# Needs Settings -> Pages -> Source: GitHub Actions, and the v* tags (and main) allowed in the
# github-pages environment. See docs/RELEASING.md.
name: APT repository

on:
  release:
    types: [released]  # published as a release, or a pre-release turned into one
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty: the latest release)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  apt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://citcomai-hub.github.io/atesta-id-wallet/apt/
    steps:
      - uses: actions/checkout@v7
      - name: The .deb of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir release
          gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern '*.deb' --pattern SHA256SUMS
          cd release && sha256sum -c SHA256SUMS --ignore-missing
      - name: Repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils gnupg  # apt-ftparchive
          packaging/build_apt_repo.sh release/*.deb site/apt
          touch site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
