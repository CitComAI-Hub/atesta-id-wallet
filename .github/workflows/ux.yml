# UX audit of every screen in the six languages and both themes (tests/test_ux.py with
# ATESTA_UX_FULL=1) every night; each push runs a shorter one through checks.yml. The report and the
# screenshots are kept as an artifact, also when a budget fails.
name: UX audit

on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: pip install ".[gui]"
      - name: Budgets
        env:
          QT_QPA_PLATFORM: offscreen
          ATESTA_UX_FULL: "1"
        run: python -m unittest discover -s tests -p test_ux.py -v
      - name: Report and screenshots
        if: always()
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ux_audit.py ux-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: ux-report
          path: ux-report/
