# Release builds: AppImage and .deb (Linux), installer and zip (Windows), SHA256SUMS(.sig).
#   git tag v0.6.0 && git push origin v0.6.0   -> builds, tests and publishes it as a pre-release;
#   marking it as the latest release on GitHub delivers it (automatic updates, APT: apt.yml)
#   push to main, or Actions -> Release -> Run workflow -> builds and tests; files kept as artifacts
# Tests and static analysis come from checks.yml. See docs/RELEASING.md.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # PyInstaller and cryptography (signing) are pinned with hashes in packaging/requirements-*.txt.
  CYCLONEDX_VERSION: "7.6.0"

jobs:
  test:
    uses: ./.github/workflows/checks.yml

  linux:
    needs: test
    # The oldest supported one: the AppImage and the .deb need glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Qt libraries (bundled into the AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0
      # Exact versions with hashes (packaging/requirements-release.txt): what goes into the build is
      # signed for the automatic updates, so a new upload to PyPI must not slip in by itself.
      - run: |
          pip install --require-hashes -r packaging/requirements-release.txt
          pip install --no-deps --no-build-isolation .
      - run: pyinstaller --noconfirm packaging/atesta-id-wallet.spec
      - name: Smoke test (bundle)
        env:
          QT_QPA_PLATFORM: offscreen
          ATESTA_ID_WALLET_HOME: ${{ runner.temp }}/wallet-bundle
        run: |
          dist/atesta-id-wallet/atesta-id-wallet --version
          dist/atesta-id-wallet/atesta-id-wallet-gui --smoke-test
      - run: packaging/build_linux.sh dist/atesta-id-wallet dist/release
      - name: SBOM (CycloneDX, the Python packages of the build)
        run: |
          python -m venv "$RUNNER_TEMP/sbom"  # apart, so the tool is not in the SBOM itself
          "$RUNNER_TEMP/sbom/bin/pip" install "cyclonedx-bom==${{ env.CYCLONEDX_VERSION }}"
          version=$(python -c "import atesta_id_wallet.common as c; print(c.__version__)")
          "$RUNNER_TEMP/sbom/bin/cyclonedx-py" environment --pyproject pyproject.toml --of JSON --output-reproducible \
            -o "dist/release/Atesta_ID_Wallet-$version-linux.cdx.json" "$(command -v python)"
      - name: Smoke test (AppImage and .deb)
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          appimage=$(ls dist/release/*.AppImage)
          ATESTA_ID_WALLET_HOME="$RUNNER_TEMP/wallet-appimage" "$appimage" --smoke-test
          ATESTA_ID_WALLET_HOME="$RUNNER_TEMP/wallet-appimage" "$appimage" cli --version
          sudo apt-get install -y ./dist/release/*.deb
          ATESTA_ID_WALLET_HOME="$RUNNER_TEMP/wallet-deb" atesta-id-wallet-gui --smoke-test
          ATESTA_ID_WALLET_HOME="$RUNNER_TEMP/wallet-deb" atesta-id-wallet --version
          # The in-app update of the .deb: its updater refreshes the project's APT repository and
          # finds nothing newer than this build; polkit knows its action.
          sudo /usr/libexec/atesta-id-wallet/update
          if command -v pkaction >/dev/null && action=$(pkaction --action-id io.github.citcomaihub.atestaidwallet.update --verbose); then
            grep -q "exec.path -> /usr/libexec/atesta-id-wallet/update" <<<"$action"
          else
            echo "::warning::polkit not available on the runner: the update action was not checked"
          fi
          sudo apt-get remove -y atesta-id-wallet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: linux
          path: dist/release/*
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Exact versions with hashes (packaging/requirements-release.txt): what goes into the build is
      # signed for the automatic updates, so a new upload to PyPI must not slip in by itself.
      - run: |
          pip install --require-hashes -r packaging/requirements-release.txt
          pip install --no-deps --no-build-isolation .
      - run: pyinstaller --noconfirm packaging/atesta-id-wallet.spec
      - name: Smoke test (bundle)
        env:
          QT_QPA_PLATFORM: offscreen
          ATESTA_ID_WALLET_HOME: ${{ runner.temp }}\wallet-bundle
        run: |
          dist\atesta-id-wallet\atesta-id-wallet.exe --version
          if ($LASTEXITCODE -ne 0) { throw "CLI failed" }
          # The GUI has no console: wait for it to finish and check the exit code.
          $p = Start-Process dist\atesta-id-wallet\atesta-id-wallet-gui.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed ($($p.ExitCode))" }
      - name: Installer and zip
        run: |
          choco install innosetup -y --no-progress
          $version = (dist\atesta-id-wallet\atesta-id-wallet.exe --version).Split(" ")[1]
          New-Item -ItemType Directory -Force dist\release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" `
            "/DSourceDir=$PWD\dist\atesta-id-wallet" "/DOutputDir=$PWD\dist\release" packaging\atesta-id-wallet.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive -Path dist\atesta-id-wallet -DestinationPath "dist\release\Atesta_ID_Wallet-$version-windows-x64.zip"
      - name: SBOM (CycloneDX, the Python packages of the build)
        run: |
          $python = (Get-Command python).Source
          python -m venv "$env:RUNNER_TEMP\sbom"
          & "$env:RUNNER_TEMP\sbom\Scripts\pip.exe" install "cyclonedx-bom==${{ env.CYCLONEDX_VERSION }}"
          if ($LASTEXITCODE -ne 0) { throw "pip failed" }
          $version = (dist\atesta-id-wallet\atesta-id-wallet.exe --version).Split(" ")[1]
          & "$env:RUNNER_TEMP\sbom\Scripts\cyclonedx-py.exe" environment --pyproject pyproject.toml --of JSON `
            --output-reproducible -o "dist\release\Atesta_ID_Wallet-$version-windows-x64.cdx.json" $python
          if ($LASTEXITCODE -ne 0) { throw "cyclonedx-py failed" }
      - name: Install, run, update and uninstall
        env:
          QT_QPA_PLATFORM: offscreen
          ATESTA_ID_WALLET_HOME: ${{ runner.temp }}\wallet-installed
        run: |
          $setup = (Get-ChildItem dist\release\*-setup.exe).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Atesta ID Wallet"
          if (-not (Test-Path "$app\atesta-id-wallet-gui.exe")) { throw "Not installed in $app" }
          foreach ($scheme in "openid4vp", "openid-credential-offer") {
            $command = (Get-ItemProperty "HKCU:\Software\Classes\$scheme\shell\open\command").'(default)'
            if ($command -ne "`"$app\atesta-id-wallet-gui.exe`" `"%1`"") { throw "Wrong $scheme handler: $command" }
          }
          $p = Start-Process "$app\atesta-id-wallet-gui.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installed GUI smoke test failed ($($p.ExitCode))" }

          # Automatic update, as updates.install_pending() does it: a verified installer waits in
          # updates\ (pending.json); the wallet starts it and exits, and the installer reopens it.
          $updates = "$env:ATESTA_ID_WALLET_HOME\updates"
          New-Item -ItemType Directory -Force $updates | Out-Null
          Copy-Item $setup $updates
          $name = Split-Path $setup -Leaf
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$updates\pending.json", "{`"version`": `"999.0.0`", `"file`": `"$name`", `"sha256`": `"$hash`"}")
          $before = (Get-Item "$app\atesta-id-wallet-gui.exe").LastWriteTimeUtc
          $started = Get-Date
          # Not -Wait: it would also wait for the installer and the reopened wallet.
          $p = Start-Process "$app\atesta-id-wallet-gui.exe" -PassThru
          if (-not $p.WaitForExit(60000)) { throw "The wallet did not exit to let the installer run" }
          if ($p.ExitCode -ne 0) { throw "The wallet exited with $($p.ExitCode) instead of starting the installer" }
          if (Test-Path "$updates\pending.json") { throw "pending.json left: the installer was not started" }
          $reopened = $null
          for ($i = 0; $i -lt 180 -and -not $reopened; $i++) {
            Start-Sleep 1
            $reopened = Get-Process atesta-id-wallet-gui -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -gt $started }
          }
          if (-not $reopened) { throw "The installer did not reopen the wallet" }
          if ((Get-Item "$app\atesta-id-wallet-gui.exe").LastWriteTimeUtc -lt $before) { throw "The program was not reinstalled" }
          Start-Sleep 5
          if ($reopened.HasExited) { throw "The reopened wallet exited ($($reopened.ExitCode))" }
          $reopened | Stop-Process -Force
          Start-Sleep 2

          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          # The uninstaller relaunches itself from %TEMP%: -Wait returns before it is done.
          for ($i = 0; $i -lt 60 -and (Test-Path "HKCU:\Software\Classes\openid4vp"); $i++) { Start-Sleep 1 }
          if (Test-Path "HKCU:\Software\Classes\openid4vp") { throw "Link handler left after uninstalling" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    # The signing key (UPDATE_SIGNING_KEY) is a secret of this environment, which requires a reviewer:
    # pushing a tag alone does not get a build signed (docs/RELEASING.md).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      # The installed applications only update themselves to files listed in a SHA256SUMS signed
      # with this key (updates.UPDATE_PUBLIC_KEY). Fails if the secret is missing or another key.
      - name: Signature for the automatic updates
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          python3 -m venv "$RUNNER_TEMP/sign"
          "$RUNNER_TEMP/sign/bin/pip" install --quiet --require-hashes -r source/packaging/requirements-sign.txt
          "$RUNNER_TEMP/sign/bin/python" source/packaging/sign_release.py release/SHA256SUMS
      # Signed provenance (Sigstore): 'gh attestation verify FILE --repo CitComAI-Hub/atesta-id-wallet'.
      # GitHub only offers it on public repositories (or private ones with Enterprise Cloud).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: release/*
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # As a pre-release: installed wallets (they only look at /releases/latest) and APT ignore it
          # until it is tested and marked as the latest release (docs/RELEASING.md).
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --title "Atesta ID Wallet ${GITHUB_REF_NAME#v}" --generate-notes --prerelease

