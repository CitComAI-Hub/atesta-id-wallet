[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atesta-id-wallet"
version = "0.12.0"
description = "Desktop wallet for verifiable credentials: OpenID4VCI 1.0 + OpenID4VP 1.0 (SD-JWT VC), no smartphone needed."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "cryptography>=45",
    "zxing-cpp>=2.2",
    "Pillow>=10",
    "keyring>=24",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]

[project.scripts]
atesta-id-wallet = "atesta_id_wallet.cli:main"

[project.gui-scripts]
atesta-id-wallet-gui = "atesta_id_wallet.gui:main"

[tool.setuptools]
packages = ["atesta_id_wallet", "atesta_id_wallet.gui", "atesta_id_wallet.i18n"]

[tool.setuptools.package-data]
"atesta_id_wallet.gui" = ["icons/*.svg", "icons/*.png", "icons/LICENSE"]
"atesta_id_wallet.i18n" = ["*.json"]

[tool.ruff]
line-length = 120
extend-exclude = ["venv", ".venv", "atesta_id_wallet/.venv", "build"]

[tool.ruff.lint]
# Errors that are bugs (syntax, undefined names, unused imports, bugbear); style is not enforced.
select = ["E9", "F", "B"]


[tool.mypy]
# CI (checks.yml) runs it on the package. The protocol code is checked; the GUI is not yet: it uses
# Qt's short enum names (Qt.AlignCenter), which PySide6's stubs only know as Qt.AlignmentFlag.AlignCenter.
python_version = "3.12"
files = ["atesta_id_wallet"]
exclude = ["\\.venv/"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["atesta_id_wallet.gui.*"]
ignore_errors = true
